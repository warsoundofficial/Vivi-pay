<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIVI PAY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#111}
.page{width:100%;max-width:520px;margin:auto;padding:25px 24px;min-height:100vh}
.logo{width:220px;height:220px;margin:12px auto 75px;border:7px solid #d9dce1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2676b7,#071846 75%);box-shadow:inset 0 0 0 3px white,0 3px 8px #0002;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;position:relative;overflow:hidden}
.logo strong{font-size:48px;letter-spacing:2px}
.logo span{font-size:28px;font-weight:bold;font-style:italic}
.logo:after{content:"";position:absolute;width:240px;height:58px;border-bottom:5px solid #45d8ff;border-radius:50%;bottom:24px;transform:rotate(-12deg)}
.field{height:78px;display:flex;align-items:center;gap:17px;padding:0 18px;background:#f6faff;border-radius:45px;margin-bottom:35px;box-shadow:0 1px 2px #dce5f1}
.ico{font-size:30px;color:#2991e7}
.field input{border:0;outline:0;background:transparent;width:100%;min-width:0;font-size:22px;color:#111;font-weight:bold}
.field input::placeholder{color:#7b8490;font-weight:normal}
.options{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:-7px;margin-bottom:75px;color:#2788d9;font-size:16px}
.options label{display:flex;align-items:center;gap:7px;white-space:nowrap}
.options input,.agree input{width:18px;height:18px;accent-color:#258cf3}
.options a{color:#2788d9;text-decoration:none;white-space:nowrap}
.login{width:100%;height:76px;border:0;border-radius:13px;background:#258cf3;color:white;font-size:25px}
.agree{text-align:center;color:#2788d9;font-size:14px;margin-top:10px}
.agree label{display:inline-flex;align-items:center;gap:8px}
@media(max-height:700px){.logo{width:160px;height:160px;margin-bottom:35px}.logo strong{font-size:38px}.logo span{font-size:22px}.options{margin-bottom:35px}}
</style>
</head>
<body>
<div class="page">
  <div class="logo">
    <strong>VIVI</strong>
    <span>PAY</span>
  </div>

  <form id="loginForm">
    <div class="field">
      <span class="ico">▯</span>
      <input id="mobile" type="tel" maxlength="10"
        placeholder="Mobile number" required>
    </div>

    <div class="field">
      <span class="ico">♙</span>
      <input id="password" type="password"
        placeholder="Password" required>
    </div>

    <div class="options">
      <label><input type="checkbox"> Save Password</label>
      <a href="#" id="forgot">Forgot password</a>
    </div>

    <button class="login" type="submit">Login</button>

    <div class="agree">
      <label><input id="agreement" type="checkbox" required>
      Agree <u>"User Privacy Agreement"</u></label>
    </div>
  </form>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const username = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value;
  const agreed = document.getElementById("agreement").checked;

  if (!agreed) {
    alert("Please accept the User Privacy Agreement.");
    return;
  }

  // College project ke liye demo admin login
  if (username === "admin" && password === "Vivi@123") {
    window.location.href = "admin.html";
  } else {
    // Normal demo login: separate OTP page
    window.location.href = "otp.html";
  }
});
</script>
